<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">amm · 从手边，到输入框</title>
  <desc id="description">产品工作方式示意，遥控器语音键通过 Control I 快捷键连接到 Mac 语音输入，并非应用截图。</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#edf3fb"/>
      <stop offset="1" stop-color="#f3f1fa"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="24" fill="url(#surface)" stroke="#dce3ef"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="44" y="56" fill="#577087" font-size="13" font-weight="600" letter-spacing="3">AIR MOUSE MIC</text>
    <text x="44" y="108" fill="#23344b" font-size="34" font-weight="650">从手边，到输入框。</text>
    <text x="44" y="140" fill="#64748a" font-size="15">一个语音键，接上你熟悉的 Mac 语音输入。</text>
    <g transform="translate(44 181)">
      <rect width="254" height="81" rx="12" fill="#fafcff" stroke="#d9e3ef"/>
      <text x="18" y="30" fill="#26384f" font-size="17" font-weight="600">遥控器语音键</text>
      <text x="18" y="56" fill="#68798f" font-size="13">按下、松手，或再次按下</text>
    </g>
    <path d="M313 222h32m-6-5 6 5-6 5" fill="none" stroke="#8ca3bc" stroke-width="1.5"/>
    <g transform="translate(360 181)">
      <rect width="224" height="81" rx="12" fill="#e5edfb" stroke="#c9d9f2"/>
      <text x="18" y="30" fill="#255898" font-size="17" font-weight="600">amm</text>
      <text x="18" y="56" fill="#4e6e96" font-size="13">Control + I · 支持自定义</text>
    </g>
    <path d="M599 222h32m-6-5 6 5-6 5" fill="none" stroke="#8ca3bc" stroke-width="1.5"/>
    <g transform="translate(646 181)">
      <rect width="270" height="81" rx="12" fill="#fafcff" stroke="#d9e3ef"/>
      <text x="18" y="30" fill="#26384f" font-size="17" font-weight="600">Mac 语音输入</text>
      <text x="18" y="56" fill="#68798f" font-size="13">由微信输入法等目标应用提供</text>
    </g>
    <path d="M44 290h872" stroke="#dce3ef"/>
    <text x="44" y="323" fill="#566c84" font-size="13">按住说话 / 按键切换</text>
    <text x="360" y="323" fill="#566c84" font-size="13">原生菜单栏工具</text>
    <text x="646" y="323" fill="#566c84" font-size="13">按键在本机处理</text>
    <text x="916" y="56" text-anchor="end" fill="#8392a6" font-size="11">工作方式示意</text>
  </g>
</svg>
